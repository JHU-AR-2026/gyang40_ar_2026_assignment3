    const code = "// snapshot:index.js\nvar MODEL_URL = \"https://raw.githubusercontent.com/CHIEFDARK77/ar-models/main/old_rusty_car.glb\";\nvar createScene = async function() {\n  var scene = new BABYLON.Scene(engine);\n  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);\n  var camera = new BABYLON.FreeCamera(\"camera1\", new BABYLON.Vector3(0, 2, -2), scene);\n  camera.setTarget(new BABYLON.Vector3(0, 0, 1));\n  camera.attachControl(canvas, true);\n  var light = new BABYLON.HemisphericLight(\"light\", new BABYLON.Vector3(0, 1, 0), scene);\n  const modelLength = 0.6;\n  const moveSpeed = 0.5;\n  const rotateSpeed = Math.PI / 2;\n  const scaleStep = 1.1;\n  const minScale = 0.1;\n  const maxScale = 10;\n  const maxDistance = 10;\n  const ground = BABYLON.MeshBuilder.CreateGround(\n    \"ground\",\n    { width: 100, height: 100 },\n    scene\n  );\n  const container = await BABYLON.SceneLoader.LoadAssetContainerAsync(\n    \"\",\n    MODEL_URL,\n    scene\n  );\n  container.addAllToScene();\n  const { min, max } = container.meshes[0].getHierarchyBoundingVectors(true);\n  container.removeAllFromScene();\n  const extent = max.subtract(min);\n  const normalizeScale = modelLength / Math.max(extent.x, extent.y, extent.z);\n  const normalizeOffset = new BABYLON.Vector3(\n    -(min.x + max.x) / 2,\n    -min.y,\n    -(min.z + max.z) / 2\n  ).scaleInPlace(normalizeScale);\n  let spawnCount = 0;\n  let current = null;\n  function spawnModel(position, yaw) {\n    const id = spawnCount++;\n    const root = new BABYLON.TransformNode(`model${id}`, scene);\n    root.position.copyFrom(position);\n    root.rotation.y = yaw;\n    const offset = new BABYLON.TransformNode(`model${id}Offset`, scene);\n    offset.parent = root;\n    offset.position.copyFrom(normalizeOffset);\n    offset.scaling.setAll(normalizeScale);\n    const entries = container.instantiateModelsToScene(\n      (name) => `${name}_${id}`,\n      false\n    );\n    entries.rootNodes.forEach((node) => {\n      node.parent = offset;\n    });\n    current = {\n      root,\n      initialPosition: root.position.clone(),\n      initialYaw: yaw,\n      initialScale: root.scaling.clone()\n    };\n    return root;\n  }\n  function scaleCurrent(factor) {\n    if (!current) return;\n    const s = BABYLON.Scalar.Clamp(\n      current.root.scaling.x * factor,\n      minScale,\n      maxScale\n    );\n    current.root.scaling.setAll(s);\n  }\n  function resetCurrent() {\n    if (!current) return;\n    current.root.position.copyFrom(current.initialPosition);\n    current.root.rotation.y = current.initialYaw;\n    current.root.scaling.copyFrom(current.initialScale);\n  }\n  function yawToward(from, to) {\n    return Math.atan2(to.x - from.x, to.z - from.z);\n  }\n  const reticle = BABYLON.MeshBuilder.CreateTorus(\n    \"reticle\",\n    { diameter: 0.1, thickness: 0.01, tessellation: 32 },\n    scene\n  );\n  const reticleMaterial = new BABYLON.StandardMaterial(\"reticleMaterial\", scene);\n  reticleMaterial.emissiveColor = new BABYLON.Color3(0.2, 1, 0.4);\n  reticleMaterial.disableLighting = true;\n  reticle.material = reticleMaterial;\n  reticle.isPickable = false;\n  reticle.rotationQuaternion = new BABYLON.Quaternion();\n  reticle.setEnabled(false);\n  const xr = await scene.createDefaultXRExperienceAsync({\n    uiOptions: {\n      sessionMode: \"immersive-ar\",\n      referenceSpaceType: \"local-floor\"\n    },\n    optionalFeatures: [\"hit-test\"],\n    disableTeleportation: true,\n    disableNearInteraction: true,\n    disableHandTracking: true,\n    pointerSelectionOptions: {\n      enablePointerSelectionOnAllControllers: true,\n      maxPointerDistance: maxDistance\n    }\n  });\n  if (!xr.baseExperience || !xr.input) {\n    return scene;\n  }\n  const sessionManager = xr.baseExperience.sessionManager;\n  xr.baseExperience.onStateChangedObservable.add((state) => {\n    const inXR = state === BABYLON.WebXRState.IN_XR;\n    ground.setEnabled(!inXR);\n    if (!inXR) reticle.setEnabled(false);\n  });\n  if (xr.pointerSelection) {\n    xr.pointerSelection.raySelectionPredicate = () => false;\n    xr.pointerSelection.displayLaserPointer = true;\n    xr.pointerSelection.displaySelectionMesh = false;\n  }\n  let rightHitTestSource = null;\n  let rightController = null;\n  let lastHit = null;\n  let rightStick = null;\n  let leftStick = null;\n  const floorPlane = BABYLON.Plane.FromPositionAndNormal(\n    BABYLON.Vector3.Zero(),\n    BABYLON.Vector3.Up()\n  );\n  const fallbackRay = new BABYLON.Ray(\n    BABYLON.Vector3.Zero(),\n    BABYLON.Vector3.Forward(),\n    maxDistance\n  );\n  function showReticle(position, normal) {\n    lastHit = { position, normal };\n    reticle.position.copyFrom(position);\n    reticle.setEnabled(true);\n  }\n  function floorHitTest() {\n    if (!rightController) return false;\n    rightController.getWorldPointerRayToRef(fallbackRay);\n    const distance = fallbackRay.intersectsPlane(floorPlane);\n    if (distance === null || distance < 0 || distance > maxDistance) return false;\n    const position = fallbackRay.origin.add(\n      fallbackRay.direction.scale(distance)\n    );\n    BABYLON.Quaternion.FromEulerAnglesToRef(0, 0, 0, reticle.rotationQuaternion);\n    showReticle(position, BABYLON.Vector3.Up());\n    return true;\n  }\n  sessionManager.onXRFrameObservable.add((frame) => {\n    lastHit = null;\n    const hit = rightHitTestSource ? frame.getHitTestResults(rightHitTestSource)[0] : null;\n    const pose = hit?.getPose(sessionManager.referenceSpace);\n    if (!pose) {\n      if (!floorHitTest()) reticle.setEnabled(false);\n      return;\n    }\n    const matrix = BABYLON.Matrix.FromArray(pose.transform.matrix);\n    if (!scene.useRightHandedSystem) {\n      matrix.toggleModelMatrixHandInPlace();\n    }\n    const position = matrix.getTranslation().scaleInPlace(sessionManager.worldScalingFactor);\n    const normal = BABYLON.Vector3.TransformNormal(\n      BABYLON.Vector3.Up(),\n      matrix\n    ).normalize();\n    BABYLON. ce: controller.inputSource.targetRaySpace\n        }).then((source) => {\n          if (disposed) {\n            source.cancel();\n          } else {\n            hitTestSource = source;\n            rightHitTestSource = source;\n          }\n        }).catch((error) => console.warn(\"Controller hit test unavailable, using floor:\", error));\n      } else {\n        console.warn(\"WebXR hit test is not supported, using floor.\");\n      }\n    }\n    controller.onMotionControllerInitObservable.add((motionController) => {\n      const thumbstick = motionController.getComponent(\"xr-standard-thumbstick\");\n      if (hand === \"right\") {\n        rightStick = thumbstick;\n        onPress(motionController.getComponent(\"xr-standard-trigger\"), () => {\n          if (xr.baseExperience.state !== BABYLON.WebXRState.IN_XR) return;\n          if (!lastHit) return;\n          const viewer = xr.baseExperience.camera.globalPosition;\n          spawnModel(lastHit.position, yawToward(lastHit.position, viewer));\n        });\n        onPress(motionController.getComponent(\"a-button\"), () => scaleCurrent(scaleStep));\n        onPress(motionController.getComponent(\"b-button\"), () => scaleCurrent(1 / scaleStep));\n      }\n      if (hand === \"left\") {\n        leftStick = thumbstick;\n        onPress(motionController.getComponent(\"x-button\"), resetCurrent);\n      }\n    });\n  });\n  return scene;\n};\nexport {\n  createScene\n};\n//# sourceMappingURL=data:application/json;base64,ewogICJ2ZXJzaW9uIjogMywKICAic291cmNlcyI6IFsic25hcHNob3Q6aW5kZXguanMiXSwKICAic291cmNlc0NvbnRlbnQiOiBbImNvbnN0IE1PREVMX1VSTCA9IFwiaHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0NISUVGREFSSzc3L2FyLW1vZGVscy9tYWluL29sZF9ydXN0eV9jYXIuZ2xiXCI7XG5cblxuZXhwb3J0IGNvbnN0IGNyZWF0ZVNjZW5lID0gYXN5bmMgZnVuY3Rpb24gKCkge1xuICAgIC8vIFRoaXMgY3JlYXRlcyBhIGJhc2ljIEJhYnlsb24gU2NlbmUgb2JqZWN0IChub24tbWVzaClcbiAgICB2YXIgc2NlbmUgPSBuZXcgQkFCWUxPTi5TY2VuZShlbmdpbmUpO1xuXG4gICAgc2NlbmUuY2xlYXJDb2xvciA9IG5ldyBCQUJZTE9OLkNvbG9
